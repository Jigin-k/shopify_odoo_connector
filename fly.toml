# Fly.io app configuration.
#
# `app` must be globally unique across all of Fly - the name below is a
# placeholder. `fly launch` will prompt you for a real one (or edit it
# here first) before the first deploy.
app = "odoo-connector"
primary_region = "sin"  # Singapore - closest Fly region to India that supports Managed Postgres

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  # This app runs a background inventory poller (setInterval) inside the
  # same process that serves HTTP - it must never be allowed to scale to
  # zero between requests, or the poller dies with it. Keeping one
  # machine running at all times is what `auto_stop_machines = false` +
  # `min_machines_running = 1` together guarantee.
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
